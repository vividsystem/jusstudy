server {
    listen 8080;
    server_name _;
		absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

		gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
				image/x-icon
        font/ttf
        font/otf;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /guides/api {
        proxy_pass http://backend:3000/api/docs;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

		location = /guides {
			return 301 /guides/;
		}

    location ^~ /guides/ {
        alias /usr/share/nginx/html/docs/guides/;
        index index.html;
    }

		location ^~ /_astro/ {
				expires 1y;
				add_header Cache-Control "immutable";
				alias /usr/share/nginx/html/docs/_astro/;
		}

		location = /robots.txt {
			alias /usr/share/nginx/html/docs/robots.txt;
		}

		location = /blume-search.json {
			alias /usr/share/nginx/html/docs/blume-search.json;
		}


    location ~* \.(js|css|png|jpg|jpeg|webp|avif|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
				add_header Cache-Control "no-cache";
				try_files $uri $uri/ /__spa-fallback.html;
    }
		location ^~ /assets/ { 
				expires 1y; 
				add_header Cache-Control "public, immutable"; 
				try_files $uri =404; 
		}
}
