services:
  backend:
    image: vividsystem/jusstudy-backend:latest
    build:
      context: ./
      dockerfile: ./server/Dockerfile
    env_file: "./server/.env"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - BOT_HOST=http://emi:8000
      - NODE_ENV=production
      - DB_USER=jusstudy_app
      - DB_HOST=postgres
      - DB_NAME=jusstudy
      - DB_PASSWORD_FILE=/run/secrets/pg_app_password
    networks:
      - public
      - backend
      - observability
    secrets:
      - pg_app_password
    depends_on:
      - alloy
      - grafana
      - postgres
      - emi
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres # admin only DO NOT USE IN APP
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_DB: jusstudy
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    secrets:
      - pg_superuser_password 
      - pg_migrator_password
      - pg_app_password
      - pg_readonly_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    shm_size: 256mb
    # TODO: add healthceck
  frontend:
    image: vividsystem/jusstudy-frontend:latest
    build:
      context: ./
      dockerfile: ./client/Dockerfile
    ports:
      - "8080:8080"
    env_file: "./client/.env"
    environment:
      - NODE_ENV=production
    networks: 
      - public
    depends_on:
      - backend
  emi:
    build: ./emi
    env_file: "./emi/.env"
    networks:
      - backend

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability
    depends_on:
      - loki
      - prometheus
      - tempo
  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - observability
  prometheus:
    image: prom/prometheus:v3.13.4-distroless
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus.yaml
      - --enable-feature=exemplar-storage
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus.yaml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
  tempo:
    image: grafana/tempo:3.1.0
    command: [ "-config.file=/etc/tempo.yaml", "-target=all"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
      # use console and alloy to get console info
      - GF_LOG_MODE=console
    volumes:
      - ./observability/datasources.grafana.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    networks:
      - observability
networks:
  observability:
    driver: bridge
  public:
  backend:
volumes:
  postgres_data:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
  alloy-data:
secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  pg_migrator_password:
    file: ./secrets/pg_migrator_password
  pg_app_password:
    file: ./secrets/pg_app_password
  pg_readonly_password:
    file: ./secrets/pg_readonly_password
