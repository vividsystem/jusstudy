services:
  backend:
    build:
      context: ./
      dockerfile: ./server/Dockerfile
    ports:
      - "3000:3000"
    env_file: "./server/.env"
    environment:
      - GRAFANA_LOKI_URL=http://loki:3100
      - BOT_HOST=http://emi:8000
    networks:
      - public
      - backend
      - observability
    depends_on:
      - loki
      - grafana
      - emi
  frontend:
    build:
      context: ./
      dockerfile: ./client/Dockerfile
    ports:
      - "8080:8080"
    env_file: "./client/.env"
    networks: 
      - public
    depends_on:
      - backend
  emi:
    build: ./emi
    env_file: "./emi/.env"
    ports:
      - "8000:8000"
    networks:
      - backend
  alloy:
    image: grafana/alloy:latest
    ports:
      - "4318:4318"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - observability
    depends_on:
      - loki
      - prometheus
      - tempo
  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    networks:
      - observability
  prometheus:
    image: prom/prometheus:v3.13.4-distroless
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus.yaml
      - --enable-feature=exemplar-storage
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus.yaml:ro
    networks:
      - observability
  tempo:
    image: grafana/tempo:3.1.0
    command: [ "-config.file=/etc/tempo.yaml", "-target=all"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - observability
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=info
      # use console and alloy to get console info
      - GF_LOG_MODE=console
    volumes:
      - ./observability/datasources.grafana.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    networks:
      - observability
networks:
  observability:
    driver: bridge
  public:
  backend:
volumes:
  jusstudy_postgres_data:
